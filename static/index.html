<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey Khatian Search</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>সার্ভে খতিয়ান সার্চ</h1>
      <p>বিভাগ → জেলা → উপজেলা → সার্ভে → মৌজা → খতিয়ান → Preview / Download</p>
    </header>

    <section class="card">
      <div class="grid">
        <label>বিভাগ<select id="division"></select></label>
        <label>জেলা<select id="district" disabled></select></label>
        <label>উপজেলা<select id="upazila" disabled></select></label>
        <label>সার্ভে<select id="survey" disabled></select></label>
        <label>মৌজা / JL<select id="mouza" disabled></select></label>
        <label>খতিয়ান / মালিক / দাগ<input id="search" disabled placeholder="Search..."></label>
      </div>
      <div class="actions"><button id="searchBtn" disabled>খুঁজুন</button><button id="resetBtn" class="secondary">Reset</button></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>খতিয়ান তালিকা</h2><span id="count">0 টি</span></div>
      <div class="table-wrap"><table><thead><tr><th>খতিয়ান</th><th>মালিক</th><th>দাগ</th><th>জমির পরিমাণ</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">প্রথমে মৌজা নির্বাচন করুন</td></tr></tbody></table></div>
    </section>
  </main>

  <dialog id="preview">
    <div class="dialog-head"><strong>PDF Preview</strong><button id="close">×</button></div>
    <iframe id="pdfFrame" title="Khatian PDF preview"></iframe>
    <div class="dialog-actions"><button id="download">Download PDF</button><button id="print" class="secondary">Print</button></div>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
